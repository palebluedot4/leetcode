# Marks this directory as the pnpm root, so pnpm never walks up the filesystem
# and adopts an unrelated workspace. There are no sub-packages.

overrides:
  # GHSA-gg6h-894w-4m9c: quadratic-time denial of service in re2js lookbehind matching, fixed
  # in 2.8.7; markdownlint pins 2.8.6. Remove once markdownlint depends on a
  # patched version.
  re2js: ^2.8.7
  # GHSA-238p-pmpm-9mq7: prototype pollution in KaTeX, fixed in 0.18.2;
  # reached through markdownlint's math extension. Remove once markdownlint
  # depends on a patched version.
  katex: ^0.18.2
